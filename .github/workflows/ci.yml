name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      chaos_repeats:
        description: "Consecutive chaos runs (P2 exit needs three green in a row)"
        default: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.12"

jobs:
  build:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anchor
          POSTGRES_PASSWORD: anchor
          POSTGRES_DB: anchor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anchor -d anchor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://anchor:anchor@localhost:5432/anchor_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Proves the schema applies to a clean Postgres. Once migrations exist this
      # also catches non-backward-compatible changes (RFC-001 B11: expand/contract only).
      - name: Validate migrations against clean database
        run: npx prisma migrate deploy

      # Regenerated and diffed rather than trusted. A hand-written response type agrees
      # with the schema exactly as far as whoever wrote it remembered — a field that
      # returns null, a connection that grew a level, a rename between API versions all
      # typecheck perfectly and fail at runtime, in code that writes prices. This is
      # also what catches a query that no longer compiles against the pinned version.
      - name: GraphQL types match the pinned schema
        run: |
          npm run graphql-codegen
          if ! git diff --quiet -- app/types; then
            echo "::error::Generated GraphQL types are out of date. Run 'npm run graphql-codegen' and commit the result."
            git diff --stat -- app/types
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # A gate, not a report. Advisories that nobody is required to look at accumulate
      # until the one that matters is indistinguishable from the nineteen that do not.
      # Transitive advisories with no reachable path here are pinned to patched versions
      # in package.json `overrides`, with the reasoning written down beside them.
      #
      # Retried, and the registry's own failures told apart from a real advisory.
      #
      # Bare `npm audit` posts to `/-/npm/v1/security/audits/quick`, which npm is retiring
      # — it says so in the output — and which returned a 503 or a 400 on three of eight
      # PRs in one afternoon, each costing six to ten minutes and a manual re-run that
      # passed unchanged. This is the only gate on a merge in this repo, so a flaky one is
      # worse than a slow one: it trains you to re-run without reading, and on 2026-09-04
      # that is exactly what happened — a genuinely red PR was merged on the assumption it
      # was this. See #570.
      #
      # `--json` uses the bulk advisory endpoint rather than the retiring quick one. Three
      # attempts, because a registry outage is not this repository's fault; a non-empty
      # advisory list still fails, because a real one is.
      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high --json > audit.json; then
              echo "No advisories at or above high."
              exit 0
            fi

            # `npm audit` exits non-zero for both "found advisories" and "could not ask".
            # The difference is whether the body is a report or an error, and only the
            # first is ours to fix.
            if jq -e '.metadata.vulnerabilities' audit.json > /dev/null 2>&1; then
              echo "::error::High or critical advisories found."
              jq '.metadata.vulnerabilities' audit.json
              exit 1
            fi

            echo "Audit endpoint did not answer (attempt ${attempt}/3):"
            head -c 400 audit.json
            sleep $((attempt * 15))
          done

          echo "::error::The npm audit endpoint did not answer after three attempts."
          exit 1

      # Includes the property tests for the resolver invariants (RFC-001 §4).
      # These are the tests that make the correctness claims real; a failure here
      # means a price could be computed wrongly, so it must block the merge.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------- the gate
  #
  # This is the job that makes the reliability claim honest. Every competitor in this
  # category says their jobs are safe; the difference is a suite that kills the worker
  # mid-chunk, drops the database under a running campaign and restarts Redis, then
  # proves the engine ends up verified-clean or visibly partial -- never quietly wrong
  # about what is live on a merchant's storefront.
  #
  # It blocks the merge. A green build with a red chaos run would mean shipping an
  # engine we have just watched fail to explain itself.
  chaos:
    name: Chaos scenarios
    runs-on: ubuntu-latest
    # The acceptance criterion is a practical runtime, so it is enforced rather than
    # hoped for. A suite that creeps toward an hour is one people start skipping.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anchor
          POSTGRES_PASSWORD: anchor
          POSTGRES_DB: anchor_chaos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anchor -d anchor_chaos"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://anchor:anchor@localhost:5432/anchor_chaos
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Consecutive, with a different seed each time. Three green runs of the same
      # seed would only prove the suite is deterministic; three green runs of three
      # different catalogues is the claim P2 exit actually wants.
      - name: Chaos suite
        run: |
          repeats="${{ github.event.inputs.chaos_repeats || '1' }}"
          for i in $(seq 1 "$repeats"); do
            echo "::group::chaos run $i of $repeats"
            CHAOS_SEED="$((20260825 + i))" npm run test:chaos
            echo "::endgroup::"
          done

      # The failure artefact: seed to replay with, run id, every row's state and
      # reason. A red chaos run whose only output is a stack trace is a red chaos run
      # nobody can act on.
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-artefacts
          path: chaos/artefacts/
          if-no-files-found: ignore
