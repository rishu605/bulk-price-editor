# Generated by `shopify app generate extension --template flow_action`, then filled in.
#
# `runtime_url` is rewritten by the CLI for a dev preview; the value here is the
# deployed app. The endpoint validates the plan gate and every guardrail exactly as
# the interface does — an action that could start a campaign the UI would refuse
# would be a way round every safety feature in the product.

[[extensions]]
name = "End a price campaign"
handle = "end-campaign"
type = "flow_action"
uid = "2f1ca836-d0ff-d660-ed32-554a5196ff87fdd8fe9a"
description = "Reverts a campaign's prices. Recomputes each price without it rather than restoring old values."
runtime_url = "https://increasingly-functioning-funk-firm.trycloudflare.com/flow/actions/end-campaign"

[settings]

  [[settings.fields]]
  type = "single_line_text_field"
  key = "campaign-id"
  name = "Campaign ID"
  description = "The campaign to end. Copy it from the campaign's page."
  required = true
