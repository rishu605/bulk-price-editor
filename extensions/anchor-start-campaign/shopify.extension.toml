# Generated by `shopify app generate extension --template flow_action`, then filled in.
#
# `runtime_url` is rewritten by the CLI for a dev preview; the value here is the
# deployed app. The endpoint validates the plan gate and every guardrail exactly as
# the interface does — an action that could start a campaign the UI would refuse
# would be a way round every safety feature in the product.

[[extensions]]
name = "Start a price campaign"
handle = "start-campaign"
type = "flow_action"
uid = "fd8b7033-d33a-12f2-0b57-dca2a841f8b50d99715b"
description = "Applies a campaign exactly as the Apply button does, including your guardrails and your plan's limits."
runtime_url = "https://increasingly-functioning-funk-firm.trycloudflare.com/flow/actions/start-campaign"

[settings]

  [[settings.fields]]
  type = "single_line_text_field"
  key = "campaign-id"
  name = "Campaign ID"
  description = "The campaign to start. Copy it from the campaign's page."
  required = true
