# Generated by `shopify app generate extension --template flow_trigger`, then filled in.
# The scaffold is kept rather than hand-written because a manifest the CLI rejects stops
# `npm run dev` starting at all — and CI never runs the CLI, so it would pass every check.
#
# Field keys are alphabetic characters and spaces only, and must match `TriggerPayload`
# in app/services/flow.server.ts exactly, or the trigger arrives with empty fields.

[[extensions]]
name = "Campaign ended"
handle = "campaign-ended"
type = "flow_trigger"
uid = "f5af5688-9f87-8eea-a322-c1f3c44ac81ccceb77bd"
description = "A price campaign's prices have been reverted. Carries ids, names, an outcome and counts — never a price."

[settings]

  [[settings.fields]]
  type = "single_line_text_field"
  key = "campaign id"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "campaign name"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "products reverted"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "outcome"
