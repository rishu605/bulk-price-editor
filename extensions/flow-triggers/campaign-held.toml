api_version = "2025-10"

[[extensions]]
type = "flow_trigger"
name = "Campaign held for drift"
handle = "campaign-held"
description = "A campaign stopped because prices were changed outside this app."

  [settings]

    [[settings.fields]]
    type = "single_line_text_field"
    key = "campaign_id"
    name = "Campaign ID"
    required = true

    [[settings.fields]]
    type = "single_line_text_field"
    key = "campaign_name"
    name = "Campaign name"
    required = true

    [[settings.fields]]
    type = "number_integer"
    key = "products_drifted"
    name = "Products with unexpected prices"
    required = true
