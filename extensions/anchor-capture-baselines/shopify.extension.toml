# Generated by `shopify app generate extension --template flow_action`, then filled in.
#
# `runtime_url` is rewritten by the CLI for a dev preview; the value here is the
# deployed app. The endpoint validates the plan gate and every guardrail exactly as
# the interface does — an action that could start a campaign the UI would refuse
# would be a way round every safety feature in the product.

[[extensions]]
name = "Capture baselines for a segment"
handle = "capture-baselines"
type = "flow_action"
uid = "8326affd-60e9-c20b-a403-6e1c1cf64ca1b5ad9926"
description = "Records today's prices as the new normal for a segment. Refused while a campaign is running."
runtime_url = "https://bulk-price-editor-production-eb91.up.railway.app/flow/actions/capture-baselines"

[settings]

  [[settings.fields]]
  type = "single_line_text_field"
  key = "segment-id"
  name = "Segment ID"
  description = "The segment whose prices become the new baseline."
  required = true
